<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월간 가계부</title>
<meta name="theme-color" content="#1E6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style id="css">
/* Layout: 요약 → 여유자금·대출 → 지출 구성 → 추이 → 거래 내역 → 규칙·설정 → 업데이트. 한 열 모바일, 두 열 데스크톱 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#EBEFEA; --ink:#17201C; --muted:#5C6962; --line:#DCE2DC;
  --accent:#1E6B58; --accent-soft:#E0EEE8;
  --good:#1D7A4C; --warn:#A8670C; --bad:#B4412D;
  --c-income:#1E6B58; --c-fixed:#3D5DA6; --c-living:#2C8E76; --c-irregular:#C0841A;
  --c-interest:#B4513C; --c-principal:#8A6F4E; --c-saving:#6C5CB6; --c-excluded:#9AA39E; --c-review:#D9480F;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#18201C; --sunk:#202A25; --ink:#E5ECE8; --muted:#97A59D; --line:#2B3530;
    --accent:#5DBE9F; --accent-soft:#1D3A30;
    --good:#5BC48C; --warn:#E0A341; --bad:#EC7C66;
    --c-income:#5DBE9F; --c-fixed:#7D9BE6; --c-living:#4FBF9E; --c-irregular:#E0A341;
    --c-interest:#E58670; --c-principal:#C3A47C; --c-saving:#A796F0; --c-excluded:#6C7671; --c-review:#FF8A50;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201C; --sunk:#202A25; --ink:#E5ECE8; --muted:#97A59D; --line:#2B3530;
  --accent:#5DBE9F; --accent-soft:#1D3A30;
  --good:#5BC48C; --warn:#E0A341; --bad:#EC7C66;
  --c-income:#5DBE9F; --c-fixed:#7D9BE6; --c-living:#4FBF9E; --c-irregular:#E0A341;
  --c-interest:#E58670; --c-principal:#C3A47C; --c-saving:#A796F0; --c-excluded:#6C7671; --c-review:#FF8A50;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1060px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:grid;gap:16px}
.pw{display:grid;gap:8px;background:var(--sunk);border-radius:12px;padding:12px 14px}
.pw label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:780px){.two{grid-template-columns:1fr}}

header.top{display:grid;gap:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.sample{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.mbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
:root[data-theme="dark"] .btn{color:#0E1512}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1512}}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.tiny{padding:4px 10px;font-size:13px;border-radius:8px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:2px 4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.msg{border-radius:10px;padding:8px 12px;font-size:14px}
.msg.good{background:color-mix(in srgb,var(--good) 12%,transparent)}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.msg.info{background:var(--sunk)}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;min-width:0;border-top:3px solid var(--tc,var(--line))}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:500}
.tile .val{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.hero{grid-column:span 1}
.up{color:var(--bad)} .down{color:var(--good)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.eq{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.eq-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.eq-row .k{min-width:0}
.eq-row .k small{display:block;color:var(--muted);font-size:12px}
.eq-row .v{font-weight:600;white-space:nowrap}
.eq-total{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.eq-total .v{font-size:20px;font-weight:700}

.loan{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.loan:first-of-type{border-top:0;padding-top:0}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}

.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stack>span{height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.legend b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.fbtn[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.tx{display:grid;grid-template-columns:48px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tx .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tx .desc{min-width:0}
.tx .desc div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tx .desc small{color:var(--muted);font-size:12px}
.tx .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx select{grid-column:2 / 4;justify-self:start}
select.bsel{font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);max-width:100%}

form.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=month],select.field{font:inherit;font-size:14px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input.w-s{width:84px} input.w-m{width:140px}
.rule{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.rule .kw{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule .x{margin-left:auto}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.filelabel{position:relative;overflow:hidden}
.filelabel input{position:absolute;inset:0;opacity:0;cursor:pointer}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="xlsx.full.min.js"></script>
</head>
<body>
<div id="app"></div>
<script id="app-js">
(function(){
"use strict";
var STORE_KEY = "gagyebu-state-v1";
var BUCKETS = {
  income:    {label:"수입",        color:"var(--c-income)"},
  fixed:     {label:"고정비",      color:"var(--c-fixed)"},
  living:    {label:"생활비",      color:"var(--c-living)"},
  irregular: {label:"비정기",      color:"var(--c-irregular)"},
  interest:  {label:"대출 이자",   color:"var(--c-interest)"},
  principal: {label:"대출 원금",   color:"var(--c-principal)"},
  saving:    {label:"저축·투자",   color:"var(--c-saving)"},
  excluded:  {label:"중복 제외",   color:"var(--c-excluded)"},
  review:    {label:"확인 필요",   color:"var(--c-review)"}
};
var OUT_ORDER = ["fixed","living","irregular","interest","saving","principal"];
var FILTER_ORDER = ["all","review","fixed","living","irregular","interest","principal","saving","income","excluded"];

/* ---------- 상태 ---------- */
var PW_KEY = "gagyebu-pw";
var state = null;
try { var ls = localStorage.getItem(STORE_KEY); if (ls) state = JSON.parse(ls); } catch(e) {}
if (!state) state = makeSample();

var ui = { month:null, filter:"all", method:null, showAll:false, msg:null, save:null, pending:null };
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e) {} }
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(function(){}); }

/* ---------- 유틸 ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function won(n){ return Math.round(n).toLocaleString("ko-KR")+"원"; }
function man(n){
  var a=Math.abs(n), s=n<0?"−":"";
  if (a>=1e8) return s+(a/1e8).toFixed(a>=1e9?0:1).replace(/\.0$/,"")+"억";
  if (a>=1e4) return s+Math.round(a/1e4).toLocaleString("ko-KR")+"만";
  return s+Math.round(a).toLocaleString("ko-KR");
}
function addMonths(m,k){ var p=m.split("-"); var d=new Date(+p[0], +p[1]-1+k, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function mLabel(m, withYear){ var y=m.slice(0,4), mo=+m.slice(5); return withYear ? y+"년 "+mo+"월" : mo+"월"; }
function thisMonth(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function toNum(v){ if (typeof v==="number") return v; if (v==null) return null; var s=String(v).replace(/[,원\s₩]/g,""); if(!/^[-+]?\d/.test(s)) return null; var n=parseFloat(s); return isNaN(n)?null:n; }
function blankState(em){ return { v:1, sample:false, tx:[], snapshots:[], rules:[], settings:{ emergencyMonths: em||3, upcoming:[], loanOriginal:{} }, lastImport:null }; }

/* ---------- 분류 ---------- */
function bucketOf(tx){
  var text = (tx.desc+" "+(tx.cat||"")+" "+(tx.sub||"")+" "+(tx.memo||"")).toLowerCase();
  var rules = state.rules||[];
  for (var i=0;i<rules.length;i++){ var kw=(rules[i].kw||"").toLowerCase(); if (kw && text.indexOf(kw)>=0) return rules[i].bucket; }
  var isIn = tx.type==="수입";
  if (/카드대금|카드값|결제대금|내계좌|본인계좌|계좌간/.test(text)) return "excluded";
  if (!isIn && /이자/.test(text) && /대출|장학|담보|마이너스/.test(text)) return "interest";
  if (!isIn && /대출|원리금|원금상환|장학재단/.test(text)) return "principal";
  if (!isIn && /적금|청약|저축|증권|투자|isa|연금저축|irp/.test(text)) return "saving";
  if (isIn) return "income";
  if (/주거|월세|관리비|통신|휴대폰|보험|구독|넷플릭스|유튜브|멜론|와우|정기결제|icloud|spotify|티빙|웨이브/.test(text)) return "fixed";
  if (/경조|축의|조의|여행|숙박|항공|선물|가전|등록금|세금|명절|용돈/.test(text)) return "irregular";
  if (tx.type==="이체") return "review";
  return "living";
}

function months(){
  var set={}; state.tx.forEach(function(t){ set[t.d.slice(0,7)]=1; });
  return Object.keys(set).sort();
}
function defaultMonth(ms){
  if (!ms.length) return thisMonth();
  var cur=thisMonth(), past=ms.filter(function(m){return m<cur;});
  return past.length ? past[past.length-1] : ms[ms.length-1];
}
/* 결제수단 → 카드사/은행 묶음. "KB국민 노리2 체크카드" → 국민카드, "국민은행 급여통장" → 국민은행 계좌 */
var ISSUERS=[[/kb|국민/i,"국민"],[/신한/,"신한"],[/삼성/,"삼성"],[/현대/,"현대"],[/롯데/,"롯데"],[/하나|외환/,"하나"],[/우리/,"우리"],[/nh|농협/i,"농협"],[/bc|비씨/i,"BC"],[/ibk|기업/i,"IBK기업"],[/씨티|citi/i,"씨티"],[/카카오페이/,"카카오페이"],[/네이버페이|naver ?pay/i,"네이버페이"],[/토스페이/,"토스페이"],[/카카오뱅크/,"카카오뱅크"],[/토스뱅크|토스/,"토스뱅크"],[/케이뱅크|k뱅크/i,"케이뱅크"],[/우체국/,"우체국"],[/새마을|mg/i,"새마을금고"]];
function issuer(m){
  m=String(m||"").trim(); if(!m) return "결제수단 없음";
  for (var i=0;i<ISSUERS.length;i++){
    if (!ISSUERS[i][0].test(m)) continue;
    var n=ISSUERS[i][1];
    if (/페이$|뱅크$|금고$|우체국/.test(n)) return n;
    if (/카드|card/i.test(m)) return n+"카드";
    if (/은행|통장|계좌|입출금/.test(m)) return n+"은행 계좌";
    return n;
  }
  return m;
}
function statsFor(m){
  var s={income:0,fixed:0,living:0,irregular:0,interest:0,principal:0,saving:0,excluded:0,review:0,reviewN:0,count:0,byCat:{},byMethod:{}};
  state.tx.forEach(function(t){
    if (t.d.slice(0,7)!==m) return;
    var b=bucketOf(t); s[b]+=t.amt; s.count++;
    if (b==="fixed"||b==="living"||b==="irregular"){
      var c=t.cat||"미분류"; s.byCat[c]=(s.byCat[c]||0)+t.amt;
      var k=issuer(t.method), bm=s.byMethod[k]||(s.byMethod[k]={amt:0,n:0}); bm.amt+=t.amt; bm.n++;
    }
    if (b==="review") s.reviewN++;
  });
  s.consumption = s.fixed+s.living+s.irregular+s.interest;
  s.surplus = s.income - s.consumption;
  s.cashflow = s.surplus - s.saving - s.principal;
  return s;
}
function snapshotFor(m){
  var list=(state.snapshots||[]).slice().sort(function(a,b){return a.m<b.m?-1:1;});
  var hit=null; list.forEach(function(s){ if (s.m<=m) hit=s; });
  return hit || (list.length? list[list.length-1] : null);
}
function sortedSnaps(){ return (state.snapshots||[]).slice().sort(function(a,b){return a.m<b.m?-1:1;}); }
function debtTotal(s){ return (s.loans||[]).reduce(function(a,l){return a+l.bal;},0); }
function netWorth(s){ return (s.cash||0)+(s.invest||0)+(s.other||0)-debtTotal(s); }

/* ---------- 렌더 ---------- */
function render(){
  var ms=months();
  if (!ui.month || ms.indexOf(ui.month)<0) ui.month=defaultMonth(ms);
  var m=ui.month, prev=addMonths(m,-1);
  var s=statsFor(m), p=statsFor(prev), hasPrev=ms.indexOf(prev)>=0;
  var html="";

  /* 헤더 */
  html+='<header class="top"><div class="top-row"><div style="display:grid;gap:4px"><h1>월간 가계부</h1>'
    +'<div class="chips">'
    +(state.sample?'<span class="chip sample">예시 데이터</span>':'<span class="chip">거래 '+state.tx.length.toLocaleString("ko-KR")+'건</span>')
    +saveChip()
    +'</div></div>'
    +'<label class="btn filelabel" for="file">뱅크샐러드 파일 올리기<input id="file" type="file" accept=".xlsx,.xls,.csv"></label>'
    +'</div>';
  if (ui.pending) html+='<form class="pw" id="pw-form"><b class="small">비밀번호가 걸린 파일이에요</b><span class="small muted">뱅크샐러드에서 내보낼 때 정한 비밀번호를 입력해 주세요. 파일은 이 휴대폰 안에서만 열려요.</span>'
    +'<div class="inline" style="display:flex;gap:6px;flex-wrap:wrap"><input type="password" id="pw" class="w-m" autocomplete="off" inputmode="text" value="'+esc(ui.pending.pw||"")+'" required><button class="btn tiny" type="submit">열기</button><button class="linkbtn" type="button" id="pw-cancel">취소</button></div>'
    +'<label class="chk" for="pw-remember"><input type="checkbox" id="pw-remember"'+(ui.pending.pw?' checked':'')+'> 이 휴대폰에 비밀번호 기억하기</label></form>';
  if (ui.msg) html+='<div class="msg '+ui.msg.kind+'">'+esc(ui.msg.text)+'</div>';

/* ---------- 비밀번호 걸린 엑셀 풀기 (ECMA-376 Agile, 기기 안에서만) ---------- */
function b64(s){ var bin=atob(s.replace(/\s/g,"")), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function cat(){ var len=0,i; for(i=0;i<arguments.length;i++) len+=arguments[i].length; var o=new Uint8Array(len),p=0; for(i=0;i<arguments.length;i++){ o.set(arguments[i],p); p+=arguments[i].length; } return o; }
function u32(n){ return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]); }
function fitLen(h,n,padByte){ if(h.length>=n) return h.slice(0,n); var o=new Uint8Array(n); o.fill(padByte); o.set(h); return o; }
function hashName(n){ n=(n||"SHA512").toUpperCase().replace("SHA","SHA-"); return n==="SHA-1"?"SHA-1":n; }
async function digest(alg,data){ return new Uint8Array(await crypto.subtle.digest(alg,data)); }
async function aesRaw(keyBytes,iv,data){
  /* WebCrypto는 패딩 없는 CBC 복호화를 지원하지 않아서, 유효한 패딩 블록을 하나 덧붙여 풀어요 */
  var key=await crypto.subtle.importKey("raw",keyBytes,{name:"AES-CBC"},false,["encrypt","decrypt"]);
  var last=data.slice(data.length-16), padBlk=new Uint8Array(16).fill(16);
  var extra=new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC",iv:last},key,padBlk)).slice(0,16);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},key,cat(data,extra)));
}
function isEncrypted(buf){
  var u=new Uint8Array(buf); if (!(u[0]===0xD0&&u[1]===0xCF&&u[2]===0x11&&u[3]===0xE0)) return false;
  try { var cfb=XLSX.CFB.read(u,{type:"array"}); return !!XLSX.CFB.find(cfb,"EncryptionInfo"); } catch(e){ return false; }
}
async function decryptXlsx(buf,password){
  var cfb=XLSX.CFB.read(new Uint8Array(buf),{type:"array"});
  var info=new Uint8Array(XLSX.CFB.find(cfb,"EncryptionInfo").content), pkg=new Uint8Array(XLSX.CFB.find(cfb,"EncryptedPackage").content);
  var vMaj=info[0]|info[1]<<8, vMin=info[2]|info[3]<<8;
  if (!(vMaj===4&&vMin===4)) throw new Error("UNSUPPORTED");
  var xml=new DOMParser().parseFromString(new TextDecoder("utf-8").decode(info.slice(8)),"application/xml");
  var kd=xml.getElementsByTagNameNS("*","keyData")[0], pe=xml.getElementsByTagNameNS("*","encryptedKey")[0];
  var spin=+pe.getAttribute("spinCount"), pAlg=hashName(pe.getAttribute("hashAlgorithm")), pSalt=b64(pe.getAttribute("saltValue")), pBits=+pe.getAttribute("keyBits");
  var pw=new Uint8Array(password.length*2); for (var i=0;i<password.length;i++){ var c=password.charCodeAt(i); pw[i*2]=c&255; pw[i*2+1]=c>>8; }
  var h=await digest(pAlg,cat(pSalt,pw));
  for (var it=0; it<spin; it++) h=await digest(pAlg,cat(u32(it),h));
  async function derive(block){ return fitLen(await digest(pAlg,cat(h,new Uint8Array(block))),pBits/8,0x36); }
  var vIn=await aesRaw(await derive([0xfe,0xa7,0xd2,0x76,0x3b,0x4b,0x9e,0x79]),pSalt,b64(pe.getAttribute("encryptedVerifierHashInput")));
  var vHash=await aesRaw(await derive([0xd7,0xaa,0x0f,0x6d,0x30,0x61,0x34,0x4e]),pSalt,b64(pe.getAttribute("encryptedVerifierHashValue")));
  var calc=await digest(pAlg,vIn.slice(0,+pe.getAttribute("saltSize")));
  for (var j=0;j<calc.length;j++) if (calc[j]!==vHash[j]) throw new Error("WRONG_PASSWORD");
  var secret=(await aesRaw(await derive([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6]),pSalt,b64(pe.getAttribute("encryptedKeyValue")))).slice(0,pBits/8);
  var kAlg=hashName(kd.getAttribute("hashAlgorithm")), kSalt=b64(kd.getAttribute("saltValue")), bs=+kd.getAttribute("blockSize");
  var size=0; for (var b=7;b>=0;b--) size=size*256+pkg[b];
  var body=pkg.slice(8), out=new Uint8Array(body.length), seg=0;
  for (var off=0; off<body.length; off+=4096, seg++){
    var chunk=body.slice(off,Math.min(off+4096,body.length));
    var iv=fitLen(await digest(kAlg,cat(kSalt,u32(seg))),bs,0x36);
    out.set(await aesRaw(secret,iv,chunk),off);
  }
  return out.slice(0,size);
}

/* ---------- 파일 읽기 ---------- */
function ymdFromSerial(n){ var p=XLSX.SSF.parse_date_code(n); return p? p.y+"-"+pad(p.m)+"-"+pad(p.d) : null; }
function toDate(v){
  if (typeof v==="number") return ymdFromSerial(v);
  var s=String(v==null?"":v).trim(), mm=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return mm? mm[1]+"-"+pad(mm[2])+"-"+pad(mm[3]) : null;
}
function toTime(v){
  if (typeof v==="number"){ var mins=Math.round((v%1)*1440); return pad(Math.floor(mins/60)%24)+":"+pad(mins%60); }
  var mm=String(v==null?"":v).match(/(\d{1,2}):(\d{2})/); return mm? pad(mm[1])+":"+mm[2] : "00:00";
}
function cellStr(c){ return String(c==null?"":c).trim(); }
function parseTx(rows,hi){
  var h=rows[hi].map(cellStr), col=function(){ for (var i=0;i<arguments.length;i++){ var k=h.indexOf(arguments[i]); if(k>=0) return k; } return -1; };
  var cD=col("날짜"),cT=col("시간"),cY=col("타입","구분"),cC=col("대분류","카테고리"),cS=col("소분류"),cN=col("내용","거래처","적요"),cA=col("금액"),cM=col("결제수단","자산"),cMemo=col("메모");
  var out=[];
  for (var i=hi+1;i<rows.length;i++){
    var r=rows[i]; if(!r) continue;
    var d=toDate(r[cD]), a=toNum(r[cA]); if(!d||a==null||a===0) continue;
    var type=cY>=0?cellStr(r[cY]):""; if(!type) type=a>0?"수입":"지출";
    out.push({ d:d, t:cT>=0?toTime(r[cT]):(typeof r[cD]==="number"?toTime(r[cD]):"00:00"), type:type,
      cat:cC>=0?cellStr(r[cC]):"", sub:cS>=0?cellStr(r[cS]):"", desc:cN>=0?cellStr(r[cN]):"(내용 없음)",
      amt:Math.abs(a), method:cM>=0?cellStr(r[cM]):"", memo:cMemo>=0?cellStr(r[cMemo]):"" });
  }
  return out;
}
function parseSnapshot(rows){
  var cash=0,invest=0,other=0,loans=[],found=false;
  var hi=-1;
  for (var i=0;i<rows.length;i++){ var r=rows[i]; if(r && r.filter(function(c){return cellStr(c)==="금액";}).length>=2){ hi=i; break; } }
  if (hi>=0){
    var ac=[]; rows[hi].forEach(function(c,i){ if(cellStr(c)==="금액") ac.push(i); });
    var kA="",kD="";
    for (var j=hi+1;j<rows.length;j++){
      var r=rows[j]||[], txt=r.map(cellStr).join(" ");
      if (/현황/.test(txt) && !r.some(function(c){return typeof c==="number";})) break;
      var a=toNum(r[ac[0]]);
      if (cellStr(r[ac[0]-2])) kA=cellStr(r[ac[0]-2]);
      if (a!=null){ var nm=cellStr(r[ac[0]-1]), t=kA+" "+nm; if(!/총|합계/.test(t)){ found=true;
        if (/자유입출금|입출금|현금|cma|파킹|보통|통장/i.test(t)) cash+=a; else if (/투자|주식|증권|펀드|연금|etf|코인|가상/i.test(t)) invest+=a; else other+=a; } }
      if (ac[1]!=null){
        var d=toNum(r[ac[1]]);
        if (cellStr(r[ac[1]-2])) kD=cellStr(r[ac[1]-2]);
        if (d!=null){ var nm2=cellStr(r[ac[1]-1])||kD; if(!/총|합계/.test(kD+" "+nm2) && d!==0){ found=true; loans.push({name:nm2, bal:Math.abs(d)}); } }
      }
    }
  }
  return found? {cash:cash,invest:invest,other:other,loans:loans} : null;
}
function parseWorkbook(wb){
  var txs=[], snap=null;
  wb.SheetNames.forEach(function(n){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
    var hi=-1;
    for (var i=0;i<rows.length;i++){ var r=rows[i]; if(r && r.some(function(c){return cellStr(c)==="날짜";}) && r.some(function(c){return cellStr(c)==="금액";})){ hi=i; break; } }
    if (hi>=0){ txs=txs.concat(parseTx(rows,hi)); return; }
    if (!snap) snap=parseSnapshot(rows);
  });
  return {txs:txs,snap:snap};
}
function txKey(t){ return [t.d,t.t,t.amt,t.desc,t.method].join("|"); }
function handleFile(file){
  if (/\.json$/i.test(file.name)) { importBackup(file); return; }
  ui.msg={kind:"info",text:"파일을 읽는 중이에요…"}; render();
  if (typeof XLSX==="undefined"){ ui.msg={kind:"bad",text:"엑셀 읽기 도구를 불러오지 못했어요. 앱을 다시 열어 주세요."}; render(); return; }
  file.arrayBuffer().then(function(buf){
    if (isEncrypted(buf)) {
      var saved=""; try { saved=localStorage.getItem(PW_KEY)||""; } catch(e){}
      ui.pending={buf:buf,pw:saved}; ui.msg=null;
      if (saved) { unlockAndImport(saved,true); return; }
      render(); var el=document.getElementById("pw"); if (el) el.focus(); return;
    }
    importBuffer(buf);
  }).catch(function(e){ ui.msg={kind:"bad",text:e.message||String(e)}; render(); });
}
function unlockAndImport(pw,remember){
  var buf=ui.pending.buf;
  ui.msg={kind:"info",text:"비밀번호를 확인하는 중이에요… (몇 초 걸려요)"}; render();
  decryptXlsx(buf,pw).then(function(plain){
    try { if (remember) localStorage.setItem(PW_KEY,pw); else localStorage.removeItem(PW_KEY); } catch(e){}
    ui.pending=null; importBuffer(plain.buffer);
  }).catch(function(e){
    var m=String(e&&e.message||e);
    if (m==="WRONG_PASSWORD"){ ui.pending.pw=""; try{localStorage.removeItem(PW_KEY);}catch(x){} ui.msg={kind:"bad",text:"비밀번호가 맞지 않아요. 다시 입력해 주세요."}; }
    else if (m==="UNSUPPORTED"){ ui.pending=null; ui.msg={kind:"bad",text:"이 파일은 지원하지 않는 방식으로 잠겨 있어요. 원본 파일을 채팅으로 보내주시면 맞춰 드릴게요."}; }
    else { ui.pending=null; ui.msg={kind:"bad",text:"파일을 풀지 못했어요: "+m}; }
    render();
  });
}
function importBuffer(buf){
  try {
    var wb;
    try { wb=XLSX.read(buf,{type:"array"}); }
    catch(e){ throw new Error("파일을 열지 못했어요: "+(e&&e.message||e)); }
    var res=parseWorkbook(wb);
    if (!res.txs.length && !res.snap) throw new Error("가계부 내역이나 자산 현황을 찾지 못했어요. 뱅크샐러드 '데이터 내보내기' 파일이 맞는지 확인해 주세요.");
    if (state.sample) state=blankState(state.settings.emergencyMonths);
    /* 같은 분·같은 금액·같은 가게 거래가 실제로 여러 번 있을 수 있어서, 개수 기준으로 비교해요 */
    var have={}; state.tx.forEach(function(t){ var k=txKey(t); have[k]=(have[k]||0)+1; });
    var added=0,dup=0;
    res.txs.forEach(function(t){ var k=txKey(t); if(have[k]>0){ have[k]--; dup++; return; } state.tx.push(t); added++; });
    var snapM=null;
    if (res.snap){ var d=new Date(); d.setDate(d.getDate()-7); snapM=d.getFullYear()+"-"+pad(d.getMonth()+1); res.snap.m=snapM;
      state.snapshots=(state.snapshots||[]).filter(function(s){return s.m!==snapM;}); state.snapshots.push(res.snap); }
    var now=new Date();
    state.lastImport={at:now.getFullYear()+"."+pad(now.getMonth()+1)+"."+pad(now.getDate()), added:added, dup:dup, snapM:snapM};
    ui.month=null; ui.filter="all";
    ui.msg={kind:"good",text:"새 거래 "+added+"건 추가, 중복 "+dup+"건 건너뜀"+(snapM?" · "+mLabel(snapM,true)+" 말 자산 현황 저장":" · 자산 현황은 찾지 못했어요")};
    save(); render();
  } catch(e){ ui.msg={kind:"bad",text:e.message||String(e)}; render(); }
}

function scrollTx(){ var el=document.getElementById("txs"); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); }
var app=document.getElementById("app");
app.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  if (t.dataset.month){ ui.month=t.dataset.month; ui.showAll=false; ui.msg=null; ui.method=null; render(); return; }

  if (t.id==="more"){ ui.showAll=true; render(); return; }
  if (t.dataset.goreview){ ui.filter="review"; ui.method=null; ui.showAll=true; render(); scrollTx(); return; }

  if (t.dataset.clearmethod){ ui.method=null; ui.showAll=false; render(); return; }

    else { t.dataset.confirm="1"; t.textContent="정말 지울까요? 한 번 더 누르면 지워져요"; }
  }
});
app.addEventListener("change",function(e){
  var t=e.target;

    var tx=state.tx[+t.dataset.tx], kw=tx.desc;
    state.rules=(state.rules||[]).filter(function(r){return r.kw!==kw;});
    state.rules.unshift({kw:kw,bucket:t.value});
    render(); scheduleSave(); return;
  }
  if (t.id==="em"){ state.settings.emergencyMonths=Math.max(0,+t.value||0); render(); scheduleSave(); return; }
  if (t.dataset.loan){ state.settings.loanOriginal=state.settings.loanOriginal||{}; var v=+t.value; if(v>0) state.settings.loanOriginal[t.dataset.loan]=v; else delete state.settings.loanOriginal[t.dataset.loan]; render(); scheduleSave(); }
});
app.addEventListener("submit",function(e){
